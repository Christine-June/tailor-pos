# Production: one server runs everything. See DEPLOY.md.
#   cp .env.production.example .env   (then fill it in)
#   docker compose -f docker-compose.prod.yml up -d --build
name: tailorpos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tailor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: tailor_pos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailor -d tailor_pos"]
      interval: 5s
      timeout: 3s
      retries: 30
    # No published port: only the API and the backup job can reach the database.

  # Shares login rate limits between the API's worker processes. Nothing here needs to survive a restart.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://tailor:${POSTGRES_PASSWORD}@db:5432/tailor_pos
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      CORS_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in .env, e.g. https://pos.yourshop.co.ke}
      RATELIMIT_STORAGE_URI: redis://redis:6379/0
      # Caddy is the one proxy in front: trust its X-Forwarded-For so rate limits see real clients.
      TRUSTED_PROXIES: "1"
      WEB_WORKERS: ${WEB_WORKERS:-3}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASE: ${RELEASE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS in .env, e.g. pos.yourshop.co.ke}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Daily database backup to ./backups on the server (copy them off the server too: DEPLOY.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: tailor
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: tailor_pos
      TZ: ${TZ:-Africa/Nairobi}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      # The API applies migrations at start; waiting for it means the first backup has the tables.
      api:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
