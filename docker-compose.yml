# Local development: database, API (with demo data) and the React app, all live-reloading.
#   docker compose up
# Then open http://localhost:5173 and sign in as owner@demo.test / demo-password
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tailor
      POSTGRES_PASSWORD: tailor
      POSTGRES_DB: tailor_pos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailor -d tailor_pos"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    volumes:
      - ./backend:/srv
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://tailor:tailor@db:5432/tailor_pos
      CORS_ORIGINS: http://localhost:5173
    command: sh -c "flask db upgrade && flask seed-demo && flask run --host 0.0.0.0 --port 5000 --debug"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:5000
      # Picks up code edits reliably inside Docker; costs a little CPU.
      VITE_POLL: "1"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

  # The production build with offline support (service worker), for trying the installable app:
  #   docker compose --profile preview up preview   then open http://localhost:4173
  preview:
    image: node:22-alpine
    profiles: ["preview"]
    working_dir: /app
    volumes:
      - ./frontend:/app
      - preview_node_modules:/app/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:5000
    command: sh -c "npm ci && npm run build && npm run preview -- --host 0.0.0.0"
    ports:
      - "4173:4173"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
  preview_node_modules:
